<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <h2 class="h5 mb-3">Nova categoria</h2>
        <!-- TODO ALUNO: associar [formGroup], formControlName e (ngSubmit) -->
        <form>
            <div class="mb-3"><label class="form-label" for="descricao">Descrição</label><input id="descricao"
                    class="form-control" placeholder="Ex.: Alimentação" disabled>
                <div class="form-text">Obrigatória, de 3 a 60 caracteres.</div>
            </div>
            <div class="mb-3"><label class="form-label" for="tipo">Tipo</label><select id="tipo" class="form-select"
                    disabled>
                    <option>Despesa</option>
                    <option>Receita</option>
                </select></div>
            <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="ativo" checked
                    disabled><label class="form-check-label" for="ativo">Ativa</label></div>
            <button class="btn btn-primary" type="button" disabled>Salvar categoria</button>
        </form>
        <p class="small text-secondary mt-3 mb-0">Atividade: habilitar o formulário e implementar as operações.</p>
    </div>
</div>
